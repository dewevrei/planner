<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKALA 스터디 플래너</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1 class="logo">SKALA 스터디 플래너</h1>
        <div class="header-actions">
            <p class="today" id="today">2026년 7월 17일</p>
            <button class="theme-button" id="theme-toggle" type="button"
                aria-label="다크 모드 켜기" aria-pressed="false">
                <span class="theme-icon" id="theme-icon" aria-hidden="true">☾</span>
                <span id="theme-label">다크 모드</span>
            </button>
        </div>
    </header>
    <main class="container">
        <section class="panel" aria-labelledby="form-title">
            <h2 id="form-title" class="panel-title">학습 목표 추가</h2>
            <form class="form" id="goal-form" novalidate>
                <label class="sr-only" for="goal-input">학습 목표</label>
                <input class="form-input" id="goal-input" type="text"
                placeholder="오늘 공부할 내용을 입력하세요" required>
                <label class="sr-only" for="goal-category">분류</label>
                <select class="form-select form-category" id="goal-category">
                    <option value="HTML">HTML</option>
                    <option value="CSS">CSS</option>
                    <option value="JS">JS</option>
                </select>
                <label class="sr-only" for="goal-priority">우선순위</label>
                <select class="form-select form-priority" id="goal-priority">
                    <option value="high">높음</option>
                    <option value="medium" selected>보통</option>
                    <option value="low">낮음</option>
                </select>
                <label class="sr-only" for="goal-due-date">마감일</label>
                <input class="form-date" id="goal-due-date" type="date">
                <button class="btn btn-primary" type="submit">추가</button>
            </form>
            <p class="form-error" id="form-error" role="alert" hidden>
                학습 목표를 한 글자 이상 입력해 주세요.
            </p>
        </section>

        <section class="panel" aria-labelledby="summary-title">
            <h2 id="summary-title" class="panel-title">분류별 남은 목표</h2>
            <ul class="summary-list" aria-live="polite">
                <li class="summary-item">
                    <span class="summary-category">HTML</span>
                    <strong class="summary-count" id="summary-html">0개</strong>
                </li>
                <li class="summary-item">
                    <span class="summary-category">CSS</span>
                    <strong class="summary-count" id="summary-css">0개</strong>
                </li>
                <li class="summary-item">
                    <span class="summary-category">JS</span>
                    <strong class="summary-count" id="summary-js">0개</strong>
                </li>
            </ul>
        </section>

        <section class="panel" aria-labelledby="list-title">
            <div class="panel-head">
                <h2 id="list-title" class="panel-title">학습 목록</h2>
                <div class="tabs" id="filter-tabs" role="group" aria-label="목록 필터">
                    <button class="tab is-active" type="button" data-filter="all">전체</button>
                    <button class="tab" type="button" data-filter="active">진행중</button>
                    <button class="tab" type="button" data-filter="done">완료</button>
                </div>
            </div>
            <div class="list-tools">
                <div class="search" role="search">
                    <label class="sr-only" for="goal-search">학습 목표 검색</label>
                    <input class="search-input" id="goal-search" type="search"
                        placeholder="학습 목표 검색" autocomplete="off" aria-controls="goal-list">
                </div>
                <div class="sort-controls" id="sort-controls" role="group" aria-label="목록 정렬">
                    <button class="sort-button is-active" type="button"
                        data-sort="deadline" aria-pressed="true">마감일 임박순</button>
                    <button class="sort-button" type="button"
                        data-sort="priority" aria-pressed="false">우선순위순</button>
                    <button class="sort-button" type="button"
                        data-sort="latest" aria-pressed="false">최신순</button>
                </div>
            </div>
            <ul class="list" id="goal-list"></ul>
            <p class="list-empty" id="list-empty" aria-live="polite">아직 등록된 목표가 없습니다.</p>
            <div class="progress">
                <div class="progress-bar">
                    <span class="progress-fill" id="progress-fill"></span>
                </div>
                <p class="progress-text" id="progress-text">전체 0개 중 0개 완료</p>
            </div>
        </section>

        <section class="panel panel-tip">
            <h2 class="panel-title">오늘의 팁</h2>
            <p class="tip" id="tip" aria-live="polite">불러오는 중...</p>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 SKALA · KDT 프로그래밍 기초</p>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
